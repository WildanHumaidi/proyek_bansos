    <!-- Font di-host sendiri dari /fonts dan dimuat lewat src/fonts.css.
         Tidak ada permintaan ke fonts.googleapis.com / fonts.gstatic.com, jadi
         aplikasi tidak lagi menunggu domain pihak ketiga sebelum teks tampil. -->

    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;

        -ms-overflow-style: none;
        scrollbar-width: none;

        background: #f1f5f9;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;

      #root {
        width: 100%;
        min-height: 100vh;
