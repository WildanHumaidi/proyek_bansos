<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMax slice" role="presentation">
  <!-- Versi siang dari deretan rumah. Dinding putih-ke-biru muda, atap seng
       abu-biru, jendela gelap (siang, bukan menyala). Kosakata kampung tetap:
       atap seng, tiang kayu, warung, jemuran, pot, motor, musholla. -->
  <defs>
    <linearGradient id="wallLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#e6f0fc"/>
      <stop offset="1" stop-color="#c8dcf0"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3cbe3"/>
      <stop offset="1" stop-color="#cadeef"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ea3c4"/>
      <stop offset="0.55" stop-color="#6388ab"/>
      <stop offset="1" stop-color="#4d7091"/>
    </linearGradient>
    <linearGradient id="zincWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aec6da"/>
      <stop offset="0.6" stop-color="#93adc5"/>
      <stop offset="1" stop-color="#7a97b2"/>
    </linearGradient>
  </defs>

  <!-- rumah 1: panggung kayu, atap pelana seng -->
  <path d="M0 900 L0 606 L236 606 L236 900 Z" fill="url(#wallShade)"/>
  <path d="M-14 606 L118 500 L250 606 Z" fill="url(#zinc)"/>
  <g stroke="#7794b0" stroke-width="1.6" opacity="0.55">
    <path d="M12 596 L118 512 M44 596 L118 534 M76 596 L118 556 M108 596 L118 578"/>
    <path d="M224 596 L118 512 M192 596 L118 534 M160 596 L118 556 M128 596 L118 578"/>
  </g>
  <g fill="#5b7b9c">
    <rect x="18" y="606" width="11" height="294"/>
    <rect x="206" y="606" width="11" height="294"/>
    <rect x="112" y="606" width="10" height="294"/>
  </g>
  <g fill="#4a6d8f">
    <rect x="52" y="646" width="34" height="42" rx="2" opacity="0.85"/>
    <rect x="150" y="646" width="34" height="42" rx="2" opacity="0.6"/>
    <rect x="98" y="716" width="38" height="48" rx="2" opacity="0.7"/>
  </g>

  <!-- rumah 2: warung, teralis naik, dagangan -->
  <path d="M236 900 L236 646 L470 646 L470 900 Z" fill="url(#wallLit)"/>
  <path d="M224 646 L482 646 L500 616 L206 616 Z" fill="url(#zincWarm)"/>
  <g stroke="#8ba6bf" stroke-width="1.5" opacity="0.6">
    <path d="M244 616 L262 646 M292 616 L306 646 M340 616 L350 646 M388 616 L394 646 M436 616 L438 646"/>
  </g>
  <rect x="268" y="676" width="150" height="92" rx="3" fill="#dce9f6"/>
  <rect x="268" y="676" width="150" height="92" rx="3" fill="#bfd6ea" opacity="0.6"/>
  <g fill="#6f92b5" opacity="0.9">
    <rect x="282" y="726" width="20" height="42" rx="3"/>
    <rect x="312" y="736" width="16" height="32" rx="2"/>
    <rect x="340" y="732" width="22" height="36" rx="3"/>
    <rect x="374" y="740" width="30" height="28" rx="2"/>
  </g>
  <g fill="#8eaac4">
    <circle cx="262" cy="640" r="4.5"/>
    <circle cx="330" cy="640" r="4.5"/>
    <circle cx="398" cy="640" r="4.5"/>
    <circle cx="452" cy="640" r="4.5"/>
  </g>
  <g fill="#6b8fb0">
    <path d="M238 800 l8 -18 l4 0 l8 18 z"/>
    <path d="M446 800 l8 -18 l4 0 l8 18 z"/>
    <path d="M462 804 l7 -15 l4 0 l7 15 z"/>
  </g>

  <!-- jemuran -->
  <path d="M470 660 Q600 690 740 656" stroke="#8ba6bf" stroke-width="2.5" fill="none"/>
  <g fill="#ffffff" opacity="0.95">
    <path d="M506 668 l0 58 l32 0 l0 -54 z"/>
    <path d="M558 672 l0 42 l44 0 l0 -40 z"/>
    <path d="M624 674 l0 66 l26 0 l0 -64 z"/>
    <path d="M672 670 l0 46 l36 0 l0 -44 z"/>
  </g>
  <g fill="#c9dcf0" opacity="0.7">
    <path d="M506 668 l32 0 l-32 20 z"/>
    <path d="M624 674 l26 0 l-26 18 z"/>
  </g>

  <!-- rumah 3: baris panjang -->
  <path d="M470 900 L470 668 L900 668 L900 900 Z" fill="url(#wallLit)"/>
  <path d="M458 668 L912 668 L912 640 L458 640 Z" fill="url(#zinc)"/>
  <g stroke="#7794b0" stroke-width="1.4" opacity="0.5">
    <path d="M480 640 L474 668 M512 640 L507 668 M544 640 L540 668 M576 640 L573 668 M608 640 L606 668 M640 640 L639 668 M672 640 L672 668 M704 640 L705 668 M736 640 L738 668 M768 640 L771 668 M800 640 L804 668 M832 640 L837 668 M864 640 L870 668 M896 640 L902 668"/>
  </g>
  <g fill="#4a6d8f">
    <rect x="498" y="706" width="38" height="48" rx="2" opacity="0.8"/>
    <rect x="576" y="712" width="36" height="44" rx="2" opacity="0.55"/>
    <rect x="700" y="700" width="50" height="60" rx="3" opacity="0.88"/>
    <rect x="790" y="712" width="34" height="44" rx="2" opacity="0.6"/>
    <rect x="852" y="704" width="34" height="50" rx="2" opacity="0.7"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <rect x="498" y="726" width="38" height="3"/>
    <rect x="700" y="726" width="50" height="3"/>
    <rect x="852" y="726" width="34" height="3"/>
  </g>

  <!-- rumah 4: dua lantai + tandon -->
  <path d="M900 900 L900 588 L1180 588 L1180 900 Z" fill="url(#wallShade)"/>
  <path d="M888 588 L1192 588 L1192 560 L888 560 Z" fill="url(#zinc)"/>
  <g stroke="#7794b0" stroke-width="1.4" opacity="0.5">
    <path d="M910 560 L914 588 M950 560 L953 588 M990 560 L992 588 M1030 560 L1031 588 M1070 560 L1070 588 M1110 560 L1109 588 M1150 560 L1148 588"/>
  </g>
  <rect x="1006" y="508" width="56" height="52" rx="6" fill="#b9cfe3"/>
  <rect x="1006" y="508" width="56" height="13" rx="5" fill="#d6e5f2"/>
  <g fill="#4a6d8f">
    <rect x="932" y="636" width="42" height="54" rx="3" opacity="0.82"/>
    <rect x="1024" y="648" width="38" height="42" rx="3" opacity="0.5"/>
    <rect x="1120" y="636" width="28" height="46" rx="2" opacity="0.72"/>
  </g>

  <!-- musholla + menara berkubah, ikut palet biru -->
  <path d="M1246 588 L1246 556 Q1290 512 1334 556 L1334 588 Z" fill="#5b85b1"/>
  <path d="M1288 514 q10 -14 6 -22 q10 12 6 22 z" fill="#b9cfe3"/>
  <rect x="1350" y="492" width="28" height="96" fill="#7498bb"/>
  <path d="M1346 492 q18 -26 36 0 z" fill="#5b85b1"/>
  <rect x="1358" y="466" width="12" height="28" fill="#7498bb"/>
  <circle cx="1364" cy="462" r="7.5" fill="#b9cfe3"/>

  <!-- rim matahari siang -->
  <!-- Rim cahaya matahari: hangat, bukan putih polos, supaya atap benar-benar
       terlihat tersentuh cahaya pagi dan bukan sekadar bergaris. -->
  <g stroke="#ffffff" stroke-width="3.4" fill="none" opacity="0.95" stroke-linecap="round">
    <path d="M118 500 L250 606"/>
    <path d="M206 616 L500 616"/>
    <path d="M458 640 L912 640"/>
    <path d="M888 560 L1192 560"/>
  </g>

  <!-- tiang listrik + trafo -->
  <g fill="#7c9dbd">
    <rect x="944" y="470" width="10" height="200"/>
    <rect x="930" y="486" width="38" height="7"/>
    <rect x="930" y="516" width="38" height="7"/>
    <rect x="972" y="500" width="20" height="26" rx="3"/>
  </g>

  <!-- motor terparkir -->
  <g fill="#5b7b9c">
    <circle cx="612" cy="856" r="26"/>
    <circle cx="716" cy="856" r="26"/>
    <circle cx="612" cy="856" r="13" fill="#e3eefb"/>
    <circle cx="716" cy="856" r="13" fill="#e3eefb"/>
    <path d="M612 830 L660 806 L700 830 L716 830 L700 848 L664 838 L632 856 z"/>
  </g>

  <!-- pintu -->
  <g fill="#5b7b9c">
    <rect x="560" y="796" width="62" height="104" rx="3"/>
    <rect x="866" y="780" width="56" height="120" rx="3"/>
    <rect x="1108" y="742" width="58" height="158" rx="3"/>
  </g>

  <!-- kabel listrik -->
  <path d="M0 640 Q420 700 944 646 T1600 672" stroke="#8ba6bf" stroke-width="3.5" fill="none" opacity="0.7"/>
</svg>
