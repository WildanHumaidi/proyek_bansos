<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMax slice" role="presentation">
  <defs>
    <!-- The warm band has to sit ABOVE the skyline (y ~ 0.44-0.56), not at the
         frame bottom: the ridge, the rooftops and the foreground hedge all cover
         the lower half, so a glow painted there is a glow nobody sees. Stops stay
         on one warm-cool axis so the ramp never passes through olive/teal. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="0.16" stop-color="#0a1830"/>
      <stop offset="0.30" stop-color="#142e52"/>
      <stop offset="0.38" stop-color="#27507e"/>
      <stop offset="0.43" stop-color="#4d7196"/>
      <stop offset="0.465" stop-color="#a8846a"/>
      <stop offset="0.49" stop-color="#dda25f"/>
      <stop offset="0.505" stop-color="#ffc978"/>
      <stop offset="0.525" stop-color="#ffe3a4"/>
      <stop offset="0.565" stop-color="#d9a878"/>
      <stop offset="0.63" stop-color="#8a7a72"/>
      <stop offset="0.80" stop-color="#4a5563"/>
      <stop offset="1" stop-color="#2a3a4a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0bd" stop-opacity="0.98"/>
      <stop offset="0.18" stop-color="#ffd977" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#f7ab52" stop-opacity="0.34"/>
      <stop offset="0.70" stop-color="#dd8a3c" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#c9772f" stop-opacity="0"/>
    </radialGradient>
    <filter id="dither" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#dither)">
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- Sun sits low, right of centre. The left third stays dark for the headline. -->
    <circle cx="1140" cy="500" r="430" fill="url(#sunGlow)"/>
    <circle cx="1140" cy="500" r="38" fill="#fff2c4"/>

    <!-- One distant ridge only, faint enough to suggest depth without blocking
         the glow. A second and third band here would just paint over the light. -->
    <path d="M0 512 L96 498 L168 506 L244 474 L330 494 L404 466 L470 486 L544 458 L618 480 L700 452 L786 476 L858 454 L940 474 L1020 444 L1104 470 L1180 446 L1266 472 L1340 452 L1420 466 L1500 442 L1584 464 L1600 462 L1600 620 L0 620 Z" fill="#3f6a92" opacity="0.26"/>
  </g>

  <!-- far rooftop silhouette: thin, broken, rim-lit on the sun side -->
  <g fill="#102641">
    <path d="M0 628 L58 628 L58 604 L104 604 L104 628 L188 628 L188 598 L246 598 L246 628 L330 628 L330 610 L392 610 L392 628 L470 628 L470 596 L534 596 L534 628 L612 628 L612 608 L676 608 L676 628 Z"/>
    <path d="M700 628 L782 628 L782 590 L830 590 L830 628 L918 628 L918 606 L986 606 L986 628 L1064 628 L1064 592 L1120 592 L1120 628 L1204 628 L1204 604 L1268 604 L1268 628 L1352 628 L1352 588 L1414 588 L1414 628 L1494 628 L1494 606 L1556 606 L1556 628 L1600 628 L1600 716 L700 716 Z"/>
  </g>
  <g stroke="#ffc98a" stroke-width="2" fill="none" opacity="0.55">
    <path d="M104 604 L104 596 M246 598 L246 590 M392 610 L392 602 M534 596 L534 588 M676 608 L676 600"/>
    <path d="M830 590 L830 582 M986 606 L986 598 M1120 592 L1120 584 M1268 604 L1268 596 M1414 588 L1414 580 M1556 606 L1556 598"/>
  </g>

  <g stroke="#0b1e36" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M262 598 L262 546 M240 566 L284 566 M248 580 L276 580"/>
    <path d="M1092 592 L1092 536 M1070 556 L1114 556 M1078 572 L1106 572"/>
    <path d="M1580 606 L1580 562 M1564 574 L1596 574"/>
  </g>

  <g stroke="#f7dcb2" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.38">
    <path d="M356 246 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M432 214 q7 -6 14 0 q7 -6 14 0"/>
    <path d="M496 268 q6 -5 12 0 q6 -5 12 0"/>
  </g>
</svg>
